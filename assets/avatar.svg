<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />

  <!-- Code decorative elements -->
  <text x="60" y="110" font-family="monospace" font-size="28" font-weight="bold" fill="rgba(255,255,255,0.25)">&lt;dev&gt;</text>
  <text x="280" y="290" font-family="monospace" font-size="28" font-weight="bold" fill="rgba(255,255,255,0.25)">&lt;/code&gt;</text>

  <!-- Torso & Suit -->
  <path d="M 100 370 Q 130 260 200 260 Q 270 260 300 370 Z" fill="url(#suitGrad)" />
  <!-- Shirt collar -->
  <polygon points="170,260 200,310 230,260" fill="#ffffff" />
  <!-- Tie -->
  <polygon points="195,290 205,290 210,360 200,370 190,360" fill="#6366f1" />

  <!-- Neck -->
  <rect x="180" y="210" width="40" height="60" rx="10" fill="#fcd34d" />

  <!-- Head -->
  <ellipse cx="200" cy="175" rx="58" ry="70" fill="url(#skinGrad)" />

  <!-- Hair -->
  <path d="M 140 170 Q 140 100 200 100 Q 260 100 260 170 Q 240 120 200 120 Q 155 120 140 170 Z" fill="#1e1b4b" />

  <!-- Glasses -->
  <rect x="156" y="152" width="34" height="26" rx="6" fill="none" stroke="#0f172a" stroke-width="4" />
  <rect x="210" y="152" width="34" height="26" rx="6" fill="none" stroke="#0f172a" stroke-width="4" />
  <line x1="190" y1="165" x2="210" y2="165" stroke="#0f172a" stroke-width="4" />

  <!-- Eyes behind glasses -->
  <circle cx="173" cy="165" r="4" fill="#0f172a" />
  <circle cx="227" cy="165" r="4" fill="#0f172a" />

  <!-- Smile -->
  <path d="M 185 205 Q 200 220 215 205" fill="none" stroke="#b45309" stroke-width="3.5" stroke-linecap="round" />
</svg>
